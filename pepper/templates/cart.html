<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#0f0f0f;
color:white;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:#111;
box-shadow:0 3px 20px rgba(0,0,0,0.5);
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:600;
color:#7CFC00;
}

.logo img{
height:40px;
border-radius:50%;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:white;
}

nav ul li a:hover{
color:#7CFC00;
}

/* CART SECTION */

.cart-section{
padding:80px 8%;
}

.cart-section h1{
text-align:center;
margin-bottom:50px;
font-size:40px;
}

/* CART GRID */

.cart-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:40px;
}

/* CART CARD */

.cart-card{
background:#1a1a1a;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
text-align:center;
padding-bottom:20px;
}
.qty{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:12px;
}

.qty span{
font-size:16px;
font-weight:600;
}
.remove-btn{
margin-top:10px;
}
.cart-card img{
width:100%;
height:250px;
object-fit:contain;
background:black;
}

.cart-card h3{
margin:15px 0;
}

.price{
color:#7CFC00;
margin-bottom:10px;
font-weight:600;
}

.btn{
background:#7CFC00;
color:black;
padding:6px 14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
text-decoration:none;
display:inline-block;
}

/* FOOTER */

footer{
background:#000;
padding:30px;
text-align:center;
margin-top:80px;
}

</style>

</head>


<body>

<!-- NAVBAR -->

<nav>

<div class="logo">
<img src="/media/logo.jpg">
<span>KODAI HILL SPICES</span>
</div>

<ul>
<li><a href="/">Home</a></li>
<li><a href="/#products">Products</a></li>
<li><a href="/#gallery">Gallery</a></li>
<li><a href="/#contact">Contact</a></li>
</ul>

</nav>


<!-- CART -->

<section class="cart-section">

<h1>Your Cart</h1>

<div class="cart-grid">

{% for item in cart %}
<div class="cart-card">

<img src="{{item.product.image.url}}">

<h3>{{item.product.name}}</h3>

<div class="price">₹ {{item.product.amount}}</div>

<div class="qty">

<a href="/decrease/{{item.id}}/" class="btn">-</a>

<span>{{item.quantity}}</span>

<a href="/increase/{{item.id}}/" class="btn">+</a>

</div>

<a href="/remove-cart/{{item.id}}/" class="btn remove-btn">Remove</a>

</div>
{% endfor %}

</div>
<h2>Total Amount : ₹ {{total}}</h2>

<br>

<a href="/checkout/" class="btn">Proceed To Checkout</a>
</section>


<footer>

<p>© 2026 Kodai Hill Spices | Pure Spice Born In The Clouds</p>

</footer>

</body>
</html>
